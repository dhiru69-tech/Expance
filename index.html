<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker — Personal Finance Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="container header-inner">
      <h1 class="app-title">Expense Tracker</h1>
      <p class="app-subtitle">Personal finance dashboard</p>
    </div>
  </header>

  <main class="container">

    <!-- ===================== DASHBOARD ===================== -->
    <section class="dashboard" aria-label="Financial summary">
      <div class="summary-card">
        <span class="summary-label">Total Balance</span>
        <span class="summary-value" id="totalBalance">₹0</span>
      </div>
      <div class="summary-card summary-card--income">
        <span class="summary-label">Total Income</span>
        <span class="summary-value" id="totalIncome">₹0</span>
      </div>
      <div class="summary-card summary-card--expense">
        <span class="summary-label">Total Expenses</span>
        <span class="summary-value" id="totalExpenses">₹0</span>
      </div>
    </section>

    <div class="main-grid">

      <!-- ===================== ADD TRANSACTION FORM ===================== -->
      <section class="panel form-panel" aria-labelledby="formHeading">
        <h2 id="formHeading" class="panel-heading">Add Transaction</h2>

        <form id="transactionForm" novalidate>

          <fieldset class="type-toggle" aria-label="Transaction type">
            <legend class="visually-hidden">Transaction type</legend>
            <label class="type-option">
              <input type="radio" name="type" value="income" />
              <span>Income</span>
            </label>
            <label class="type-option">
              <input type="radio" name="type" value="expense" checked />
              <span>Expense</span>
            </label>
          </fieldset>

          <div class="form-group">
            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              name="description"
              placeholder="e.g. Groceries"
              autocomplete="off"
            />
            <span class="field-error" id="descriptionError" role="alert"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount (₹)</label>
              <input
                type="number"
                id="amount"
                name="amount"
                placeholder="0"
                min="0.01"
                step="0.01"
                inputmode="decimal"
              />
              <span class="field-error" id="amountError" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" />
              <span class="field-error" id="dateError" role="alert"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <!-- Options are filled in dynamically by script.js based on type -->
            </select>
            <span class="field-error" id="categoryError" role="alert"></span>
          </div>

          <button type="submit" class="btn btn-primary">Add Transaction</button>
        </form>
      </section>

      <!-- ===================== TRANSACTIONS ===================== -->
      <section class="panel list-panel" aria-labelledby="listHeading">
        <div class="list-panel-header">
          <h2 id="listHeading" class="panel-heading">Recent Transactions</h2>
        </div>

        <div class="controls">
          <div class="form-group search-group">
            <label for="searchInput" class="visually-hidden">Search transactions</label>
            <input
              type="search"
              id="searchInput"
              placeholder="Search by description or category"
            />
          </div>

          <div class="form-group">
            <label for="filterSelect" class="visually-hidden">Filter transactions</label>
            <select id="filterSelect">
              <option value="all">All</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <div class="form-group">
            <label for="sortSelect" class="visually-hidden">Sort transactions</label>
            <select id="sortSelect">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="highest">Highest amount</option>
              <option value="lowest">Lowest amount</option>
            </select>
          </div>
        </div>

        <ul class="transaction-list" id="transactionList" aria-live="polite">
          <!-- Transactions are rendered here by script.js -->
        </ul>

        <p class="empty-state" id="emptyState" hidden>
          No transactions yet. Add your first income or expense using the form.
        </p>
      </section>

    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="script.js"></script>
</body>
</html>
